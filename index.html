<!doctype html>
<html lang="th">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="main.css">
    </head>

    <body>
        <div class="container">
            <header class="header">
                <img src="img/KEEHIN.png" alt="KEEHIN Logo" class="logo">
            </header>

            <form id="form">
                <div class="form-group">
                    <label>รายงาน</label>
                    <div id="report" class="checkbox-group">
                        <label><input type="radio" name="report" value="A01"> 1 เช็คเวลาประจำวัน</label>
                        <label><input type="radio" name="report" value="A02"> 2 ตรวจสอบรายบุคคล</label>
                        <label><input type="radio" name="report" value="A03"> 3 สรุปประจำเดือน</label>
                        <label><input type="radio" name="report" value="A04"> 4 วิเคราะห์พนักงาน</label>
                        <label><input type="radio" name="report" value="A05"> 5 วิเคราะห์บริษัท</label>
                    </div>
                </div>

                <input type="hidden" name="db" id="db" value="payroll" />

                <div class="picker">
                    <div class="date-fields">
                        <div class="date-box">
                            <label class="date-box-label" for="startDateInput">startDate</label>
                            <input class="date-input" id="startDateInput" type="text" autocomplete="off" />
                            <input type="hidden" name="startDate" id="startDate" value="2025-12-02" />
                        </div>

                        <div class="date-box">
                            <label class="date-box-label" for="endDateInput">endDate</label>
                            <input class="date-input" id="endDateInput" type="text" autocomplete="off" />
                            <input type="hidden" name="endDate" id="endDate" value="2025-12-03" />
                        </div>
                    </div>

                    <input type="hidden" id="periodTypeInput" value="year" />

                    <div class="preset-controls">
                        <select id="yearSelect" class="control-select"></select>
                        <select id="monthSelect" class="control-select"></select>
                        <select id="quarterSelect" class="control-select"></select>
                    </div>

                    <div class="calendar-card">
                        <div class="calendar-head">
                            <button type="button" class="nav-arrow" id="prevBtn" aria-label="เดือนก่อนหน้า">
                                &#8249;
                            </button>

                            <div class="calendar-title" id="calendarTitle"></div>

                            <button type="button" class="nav-arrow" id="nextBtn" aria-label="เดือนถัดไป">
                                &#8250;
                            </button>
                        </div>

                        <div class="weekdays" id="weekdays"></div>
                        <div class="days" id="days"></div>
                    </div>

                    <div class="actions">
                        <button type="button" class="btn-clear" id="clearBtn">Clear</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>บริษัท</label>
                    <div id="comCode" class="checkbox-group">
                        <label><input type="checkbox" name="comCode" value="01"> 1 กี่หิ้น การไฟฟ้าภูเก็ต</label>
                        <label><input type="checkbox" name="comCode" value="02"> 2 บ้านสุขภัณฑ์และวัสดุ</label>
                        <label><input type="checkbox" name="comCode" value="03"> 3 กี่หิ้น เทรดดิ้งจำกัด</label>
                        <label><input type="checkbox" name="comCode" value="04"> 4 เคบีคอมเมิร์ซจำกัด</label>
                        <label><input type="checkbox" name="comCode" value="05"> 5 กี่หิ้น เวอร์คชอพจำกัด</label>
                        <label><input type="checkbox" name="comCode" value="06"> 6 กี่หิ้น คอนเทร็คเตอร์จำกัด</label>
                        <label><input type="checkbox" name="comCode" value="07"> 7 พนักงานจ้าง</label>
                    </div>
                </div>
            </form>

            <div class="button-group">
                <button type="button" class="btn-primary" id="getPdfBtn" onclick="getPDF()">getPDF</button>
                <button type="button" class="btn-primary" id="openPdfBtn" onclick="openPDF()">openPDF</button>
            </div>
        </div>

        <script src="main.js"></script>
    </body>
</html>
