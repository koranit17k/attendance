<!doctype html>
<html lang="th">
    <head>
        <meta charset="UTF-8" />
        <title>KxReport Viewer</title>

        <link rel="stylesheet" href="main.css">
    </head>

    <body>
        <div class="container">
            <h2>KX Report Viewer</h2>

            <form id="form">
                <div class="form-group">
                    <label>Report Name</label>
                    <select name="report" id="report">
                        <option value="A01">1 เช็คเวลาประจำวัน</option>
                        <option value="A02">2 ตรวจสอบรายบุคคล</option>
                        <option value="A03">3</option>
                    </select>
                </div>

                <input type="hidden" name="db" id="db" value="payroll" />

                <div class="picker">
                    <div class="date-fields">
                        <div class="date-box">
                            <label class="date-box-label" for="startDateInput">startDate</label>
                            <input class="date-input" id="startDateInput" type="text" autocomplete="off" />
                            <input type="hidden" name="startDate" id="startDate" value="2025-12-02" />
                        </div>

                        <div class="date-box">
                            <label class="date-box-label" for="endDateInput">endDate</label>
                            <input class="date-input" id="endDateInput" type="text" autocomplete="off" />
                            <input type="hidden" name="endDate" id="endDate" value="2025-12-03" />
                        </div>
                    </div>

                    <input type="hidden" id="periodTypeInput" name="periodType" value="year" />

                    <div class="preset-controls">
                        <select id="yearSelect" class="control-select"></select>
                        <select id="monthSelect" class="control-select"></select>
                        <select id="quarterSelect" class="control-select"></select>
                    </div>

                    <div class="calendar-card">
                        <div class="calendar-head">
                            <button type="button" class="nav-arrow" id="prevBtn" aria-label="เดือนก่อนหน้า">
                                &#8249;
                            </button>

                            <div class="calendar-title" id="calendarTitle"></div>

                            <button type="button" class="nav-arrow" id="nextBtn" aria-label="เดือนถัดไป">
                                &#8250;
                            </button>
                        </div>

                        <div class="weekdays" id="weekdays"></div>
                        <div class="days" id="days"></div>
                    </div>

                    <div class="actions">
                        <button type="button" class="btn-clear" id="clearBtn">ล้างค่า</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Company</label>
                    <select name="comCode" id="comCode">
                        <option value="01">1 กี่หิ้น การไฟฟ้าภูเก็ต</option>
                        <option value="02">2 บ้านสุขภัณฑ์และวัสดุ</option>
                        <option value="03">3 กี่หิ้น เทรดดิ้งจำกัด</option>
                        <option value="04">4 เคบีคอมเมิร์ซจำกัด</option>
                        <option value="05">5 กี่หิ้น เวอร์คชอพจำกัด</option>
                        <option value="06">6 กี่หิ้น คอนเทร็คเตอร์จำกัด</option>
                        <option value="07">7 พนักงานจ้าง</option>
                    </select>
                </div>
            </form>

            <div class="button-group">
                <button class="btn-primary" onclick="getPDF()">getPDF</button>
                <button class="btn-primary" onclick="openPDF()">openPDF</button>
            </div>
        </div>

        <script src="main.js"></script>
    </body>
</html>
<!-- พรุ่งนี้ออกแบบ frontendเพิ่ม ให้สวยมีความสมูท calenda เป็นเลือกช่วงเวลาได้ หรือ แบบพิมเวลา, ดูโครง report 2,3,4-->
